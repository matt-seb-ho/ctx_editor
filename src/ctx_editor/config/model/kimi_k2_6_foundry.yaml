# Kimi-K2.6 via Azure AI Foundry (mgalley-foundry2).
#
# Use with:
#   ctx-editor model=kimi_k2_6_foundry load_balancer=multi_endpoint_foundry

name: kimi-k2.6-foundry

user:
  model: gpt-4o-mini
  max_tokens: 1000
  temperature: 1.0

assistant:
  model: Kimi-K2.6
  max_tokens: 10000
  temperature: 1.0
  timeout: 300

system:
  model: gpt-4o-mini
  max_tokens: 1000
  temperature: 0.0

ctx_editor:
  model: Kimi-K2.6
  max_tokens: 12000
  temperature: 1.0
  timeout: 300
