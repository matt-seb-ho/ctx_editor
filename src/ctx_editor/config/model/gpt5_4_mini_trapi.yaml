# GPT-5.4-mini via TRAPI (redmond/interactive), for the NeurIPS rebuttal
# experiments. Assistant + context-editor = gpt-5.4-mini_2026-03-17; user-sim and
# system/extraction roles = gpt-4o_2024-11-20 (both served on redmond/interactive).
# Pair with load_balancer=trapi.

name: gpt-5.4-mini

user:
  model: gpt-4o_2024-11-20
  max_tokens: 1000
  temperature: 1.0

assistant:
  model: gpt-5.4-mini_2026-03-17
  max_tokens: 10000
  temperature: 1.0
  timeout: 300
  reasoning_effort: medium

system:
  model: gpt-4o_2024-11-20
  max_tokens: 1000
  temperature: 0.0

ctx_editor:
  model: gpt-5.4-mini_2026-03-17
  max_tokens: 12000
  temperature: 1.0
  timeout: 300
  reasoning_effort: medium
