# DeepSeek V4 Flash via Azure AI Foundry (mgalley-foundry2).
#
# Use with:
#   ctx-editor model=deepseek_v4_flash_foundry load_balancer=multi_endpoint_foundry

name: deepseek-v4-flash-foundry

user:
  model: gpt-4o-mini
  max_tokens: 1000
  temperature: 1.0

assistant:
  model: DeepSeek-V4-Flash
  max_tokens: 10000
  temperature: 1.0
  timeout: 300

system:
  model: gpt-4o-mini
  max_tokens: 1000
  temperature: 0.0

ctx_editor:
  model: DeepSeek-V4-Flash
  max_tokens: 12000
  temperature: 1.0
  timeout: 300
