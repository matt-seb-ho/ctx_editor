# GPT-5-mini model configuration
name: gpt-5-mini-and-nano

# Per-role model configuration
user:
  model: gpt-5-nano
  max_tokens: 10000
  temperature: 1.0

assistant:
  model: gpt-5-mini
  max_tokens: 10000
  temperature: 1.0
  timeout: 60
  reasoning_effort: medium

system:
  model: gpt-5-nano
  max_tokens: 10000
  temperature: 1.0

ctx_editor:
  model: gpt-5-mini
  max_tokens: 12000
  temperature: 1.0
  timeout: 60
  reasoning_effort: medium
