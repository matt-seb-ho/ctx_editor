# Phi-4 (non-reasoning) via Azure AI Foundry (mgalley-foundry2).
#
# Use with:
#   ctx-editor model=phi4_foundry load_balancer=multi_endpoint_foundry

name: phi-4-foundry

user:
  model: gpt-4o-mini
  max_tokens: 1000
  temperature: 1.0

assistant:
  model: Phi-4
  max_tokens: 10000
  temperature: 1.0
  timeout: 300

system:
  model: gpt-4o-mini
  max_tokens: 1000
  temperature: 0.0

ctx_editor:
  model: Phi-4
  max_tokens: 12000
  temperature: 1.0
  timeout: 300
