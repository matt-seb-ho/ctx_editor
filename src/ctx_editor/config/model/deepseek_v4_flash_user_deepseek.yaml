# DeepSeek V4 Flash as both assistant AND user simulator.
# Used for the post-NeurIPS R2 CollabLLM bigcodebench investigation —
# tests the hypothesis that gpt-4o-mini-as-user simulator drifts off-spec
# and starves the assistant of the actual task requirements.
#
# Use with:
#   ctx-editor model=deepseek_v4_flash_user_deepseek load_balancer=multi_endpoint_foundry

name: deepseek-v4-flash-user-deepseek

user:
  model: DeepSeek-V4-Flash
  max_tokens: 1000
  temperature: 1.0

assistant:
  model: DeepSeek-V4-Flash
  max_tokens: 10000
  temperature: 1.0
  timeout: 300

system:
  model: gpt-4o-mini
  max_tokens: 1000
  temperature: 0.0

ctx_editor:
  model: DeepSeek-V4-Flash
  max_tokens: 12000
  temperature: 1.0
  timeout: 300
