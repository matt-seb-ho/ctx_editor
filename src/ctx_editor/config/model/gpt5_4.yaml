# GPT-5.4 model configuration. Hosted on dl-openai-1 (high quota) and
# dl-openai-3 (lower quota). Pair with a load_balancer config that lists
# both endpoints; routing_strategy=least_loaded will steer traffic
# proportionally to each endpoint's max_concurrent.

name: gpt-5.4

user:
  model: gpt-4o-mini
  max_tokens: 1000
  temperature: 1.0

assistant:
  model: gpt-5.4
  max_tokens: 10000
  temperature: 1.0
  timeout: 300
  reasoning_effort: medium

system:
  model: gpt-4o-mini
  max_tokens: 1000
  temperature: 0.0

ctx_editor:
  model: gpt-5.4
  max_tokens: 12000
  temperature: 1.0
  timeout: 300
  reasoning_effort: medium
