# GPT-5-mini model configuration with low reasoning effort
# For CollabLLM experiments matching 8B-class model capability
name: gpt-5-mini-low

# Per-role model configuration
user:
  model: gpt-4o-mini
  max_tokens: 1000
  temperature: 1.0

assistant:
  model: gpt-5-mini
  max_tokens: 10000
  temperature: 1.0
  timeout: 300
  reasoning_effort: low

system:
  model: gpt-4o-mini
  max_tokens: 1000
  temperature: 0.0

ctx_editor:
  model: gpt-5-mini
  max_tokens: 12000
  temperature: 1.0
  timeout: 300
  reasoning_effort: low
