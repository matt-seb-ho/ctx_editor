# GPT-5.5 via Azure AI Foundry (mgalley-foundry2). The OpenAI-side Azure
# deployments (dl-openai-1, dl-openai-3, fxdata-*) do NOT host gpt-5.5 as of
# 2026-05-13 — only the Foundry endpoint does.
#
# Use with:
#   ctx-editor model=gpt5_5_foundry load_balancer=multi_endpoint_foundry
#
# Reported quota (x-ratelimit-limit-requests on Foundry): 250 RPM.

name: gpt-5.5-foundry

user:
  model: gpt-4o-mini
  max_tokens: 1000
  temperature: 1.0

assistant:
  model: gpt-5.5
  max_tokens: 10000
  temperature: 1.0
  timeout: 300
  reasoning_effort: medium

system:
  model: gpt-4o-mini
  max_tokens: 1000
  temperature: 0.0

ctx_editor:
  model: gpt-5.5
  max_tokens: 12000
  temperature: 1.0
  timeout: 300
  reasoning_effort: medium
