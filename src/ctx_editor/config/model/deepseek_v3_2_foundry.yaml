# DeepSeek V3.2 via Azure AI Foundry (mgalley-foundry2).
#
# Use with: ctx-editor model=deepseek_v3_2_foundry load_balancer=multi_endpoint_foundry
#
# The load balancer is REQUIRED because the Foundry endpoint hosts only
# non-OpenAI models, so user/system gpt-4o-mini calls must go to a regular
# Azure OpenAI endpoint. The multi_endpoint_foundry load_balancer wires both.

name: deepseek-v3.2-foundry

user:
  model: gpt-4o-mini
  max_tokens: 1000
  temperature: 1.0

assistant:
  model: DeepSeek-V3.2
  max_tokens: 10000
  temperature: 1.0
  timeout: 300

system:
  model: gpt-4o-mini
  max_tokens: 1000
  temperature: 0.0

ctx_editor:
  model: DeepSeek-V3.2
  max_tokens: 12000
  temperature: 1.0
  timeout: 300
