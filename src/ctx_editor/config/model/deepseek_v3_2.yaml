# DeepSeek V3.2 via OpenRouter
name: deepseek-v3.2

# Per-role model configuration
user:
  model: gpt-4o-mini
  max_tokens: 1000
  temperature: 1.0

assistant:
  model: deepseek/deepseek-v3.2
  max_tokens: 10000
  temperature: 1.0
  timeout: 300

system:
  model: gpt-4o-mini
  max_tokens: 1000
  temperature: 0.0

ctx_editor:
  model: deepseek/deepseek-v3.2
  max_tokens: 12000
  temperature: 1.0
  timeout: 300
