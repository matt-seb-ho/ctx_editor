# gpt-oss-120b via Azure AI Foundry (mgalley-foundry2).
#
# Use with:
#   ctx-editor model=gpt_oss_120b_foundry load_balancer=multi_endpoint_foundry

name: gpt-oss-120b-foundry

user:
  model: gpt-4o-mini
  max_tokens: 1000
  temperature: 1.0

assistant:
  model: gpt-oss-120b
  max_tokens: 10000
  temperature: 1.0
  timeout: 300

system:
  model: gpt-4o-mini
  max_tokens: 1000
  temperature: 0.0

ctx_editor:
  model: gpt-oss-120b
  max_tokens: 12000
  temperature: 1.0
  timeout: 300
