# GPT-5-mini assistant + GPT-4o user/system
name: gpt5m-gpt4o

# Per-role model configuration
user:
  model: gpt-4o
  max_tokens: 1000
  temperature: 1.0

assistant:
  model: gpt-5-mini
  max_tokens: 10000
  temperature: 1.0
  timeout: 300
  reasoning_effort: medium

system:
  model: gpt-4o
  max_tokens: 1000
  temperature: 0.0

ctx_editor:
  model: gpt-5-mini
  max_tokens: 12000
  temperature: 1.0
  timeout: 300
  reasoning_effort: medium
