defaults:
  - _self_

# ─── Huang/WildChat eval, Phase 1 ──────────────────────────────────────────
# Hydra-ified version of the legacy argparse entry point.
# Usage:
#   python -m ctx_editor.huang_eval.run_phase1
#   python -m ctx_editor.huang_eval.run_phase1 num_conversations=30 seed=42
#   python -m ctx_editor.huang_eval.run_phase1 --multirun seed=42,43,44

experiment_name: huang_phase1_${respondent_model}_n${num_conversations}

# Data
dataset: allenai/WildChat-1M
num_conversations: 100
max_scan: 10000

# Models — all three default to gpt-5-mini (matches paper protocol)
respondent_model: gpt-5-mini
judge_model: gpt-5-mini
classifier_model: gpt-5-mini

# Execution
max_concurrent: 5
seed: 42

# Logging
logging:
  output_dir: outputs/huang_eval/phase1/${now:%Y-%m-%d}/${now:%H-%M-%S}
  verbose: false
