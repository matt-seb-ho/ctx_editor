# Multi-endpoint load balancer with Azure AI Foundry for non-OpenAI models.
#
# Enable with: ctx-editor load_balancer=multi_endpoint_foundry
#
# Routing:
# - Azure AI Foundry (mgalley-foundry2) serves non-OpenAI models (DeepSeek, grok,
#   Kimi, Llama, Phi, Mistral). Auth is an AAD bearer token via
#   AzureCliCredential -> ManagedIdentityCredential, mirroring scripts/test_non_oai.py.
# - Regular Azure OpenAI endpoints serve gpt-4o / gpt-4o-mini / gpt-5* for the
#   user/system roles (the Foundry endpoint does not host OpenAI models).

endpoints:
  # Per-model caps below are RPM-equivalents reported by the Foundry endpoint's
  # `x-ratelimit-limit-requests` header (verified 2026-05-13). Models without
  # exposed rate-limit headers (Phi-4, the older DeepSeek/grok deployments,
  # Llama, Mistral) keep conservative placeholders; treat the Foundry-confirmed
  # numbers (DeepSeek-V4-Flash, Kimi-K2.6, gpt-oss-120b, gpt-5.5) as authoritative.
  - name: "mgalley-foundry2"
    type: "azure_foundry"
    endpoint: "https://mgalley-foundry2.services.ai.azure.com/openai/v1/"
    auth_method: "azure_identity"
    max_concurrent: 10
    priority: 1
    supported_models:
      DeepSeek-V3.2: 10
      DeepSeek-V3.1: 10
      DeepSeek-V3.2-Speciale: 10
      DeepSeek-V4-Flash: 250
      DeepSeek-R1-0528: 10
      grok-4-1-fast-non-reasoning: 10
      grok-4-1-fast-reasoning: 10
      grok-4-20-non-reasoning: 10
      grok-4-20-reasoning: 10
      Kimi-K2.6: 100
      Llama-3.3-70B-Instruct: 10
      Phi-4: 1
      Phi-4-reasoning: 1
      Mistral-Large-3: 10
      gpt-oss-120b: 250
      gpt-5.5: 250

  # gpt-4o-mini is intentionally NOT listed on dl-openai-3 — its quota
  # there (45) is dwarfed by fxdata-shared (2000), so all gpt-4o-mini
  # traffic for user/system roles stays on fxdata-shared.
  - name: "dl-openai-3"
    type: "azure"
    endpoint: "https://dl-openai-3.openai.azure.com"
    api_version: "2024-10-21"
    auth_method: "azure_cli"
    max_concurrent: 10
    priority: 1
    supported_models:
      gpt-4o: 10
      gpt-5: 10
      gpt-5-mini: 150
      gpt-5-nano: 10

  - name: "fxdata-shared"
    type: "azure"
    endpoint: "https://fxdata-shared.openai.azure.com"
    api_version: "2024-10-21"
    auth_method: "azure_cli"
    max_concurrent: 10
    priority: 2
    supported_models:
      gpt-4o: 10
      gpt-4o-mini: 2000
      gpt-5: 10

routing_strategy: "least_loaded"
fallback_enabled: true
max_retries_per_endpoint: 2
