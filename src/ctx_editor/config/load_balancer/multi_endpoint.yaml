# Multi-endpoint load balancer configuration
# Enable with: ctx-editor load_balancer=multi_endpoint

endpoints:
  # # Example Azure endpoint with Azure CLI auth
  # - name: "azure-eastus"
  #   type: "azure"
  #   endpoint: "https://your-resource-eastus.openai.azure.com"
  #   api_version: "2024-10-21"
  #   auth_method: "azure_cli"
  #   max_concurrent: 10
  #   priority: 1
  #   supported_models:
  #     - "gpt-4o-mini"
  #     - "gpt-5-mini"
  #
  # # Example Azure endpoint with API key auth
  # - name: "azure-westus"
  #   type: "azure"
  #   endpoint: "https://your-resource-westus.openai.azure.com"
  #   api_version: "2024-10-21"
  #   auth_method: "api_key"
  #   api_key_env: "AZURE_WESTUS_API_KEY"
  #   max_concurrent: 8
  #   priority: 2
  #   supported_models:
  #     - "gpt-5-mini"
  #
  # # Example direct OpenAI endpoint
  # - name: "openai-direct"
  #   type: "openai"
  #   api_key_env: "OPENAI_API_KEY"
  #   max_concurrent: 5
  #   priority: 3
  #   supported_models:
  #     - "gpt-4o-mini"
  #     - "gpt-4o"

  # Capacities below are the Foundry-reported quotas (RPM-equivalent) for
  # the models we actively route. Models without explicit caps fall back to
  # the endpoint-level max_concurrent value (placeholder 10); update those
  # when their real quota is known. gpt-4o-mini is intentionally omitted
  # from dl-openai-1/3 — their gpt-4o-mini quotas (10 and 45) are dwarfed
  # by fxdata-shared (2000), so all gpt-4o-mini traffic stays there.

  - name: "dl-openai-1"
    type: "azure"
    endpoint: "https://dl-openai-1.openai.azure.com"
    api_version: "2024-10-21"
    auth_method: "azure_cli"
    max_concurrent: 10  # fallback for models without explicit cap below
    priority: 1
    supported_models:
      gpt-4o: 10
      gpt-5: 10
      gpt-5-mini: 150
      gpt-5.4: 1000

  - name: "dl-openai-3"
    type: "azure"
    endpoint: "https://dl-openai-3.openai.azure.com"
    api_version: "2024-10-21"
    auth_method: "azure_cli"
    max_concurrent: 10
    priority: 1
    supported_models:
      gpt-4o: 10
      gpt-5: 10
      gpt-5-chat: 10
      gpt-5-mini: 150
      gpt-5-nano: 10
      gpt-5.2: 10
      gpt-5.2-chat: 10
      gpt-5.4: 250

  - name: "fxdata-eastus2"
    type: "azure"
    endpoint: "https://fxdata-eastus2.openai.azure.com"
    api_version: "2024-10-21"
    auth_method: "azure_cli"
    max_concurrent: 10
    priority: 1
    supported_models:
      gpt-4o: 10
      gpt-5: 10
      gpt-5-mini: 150
      gpt-5-nano: 10
      gpt-5.1: 10
      gpt-5.2: 10
      gpt-5.2-codex: 10

  - name: "fxdata-shared"
    type: "azure"
    endpoint: "https://fxdata-shared.openai.azure.com"
    api_version: "2024-10-21"
    auth_method: "azure_cli"
    max_concurrent: 10
    priority: 1
    supported_models:
      gpt-4o: 10
      gpt-4o-mini: 2000
      gpt-5: 10


# Routing strategy options:
# - "round_robin": Fair distribution across endpoints (default)
# - "least_loaded": Route to endpoint with lowest current load
# - "priority": Prefer endpoints with lower priority number
routing_strategy: "least_loaded"

# Try other endpoints if one fails
fallback_enabled: true

# Max retries per endpoint before moving to next
max_retries_per_endpoint: 3
