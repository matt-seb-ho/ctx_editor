  - name: "dl-openai-1"
    type: "azure"
    endpoint: "https://dl-openai-1.openai.azure.com"
    api_version: "2024-10-21"
    auth_method: "azure_cli"
    max_concurrent: 10
    priority: 1
    supported_models:
      - "gpt-4o"
      # - "gpt-4o-mini"
      - "gpt-5"
      - "gpt-5-mini"

  - name: "dl-openai-3"
    type: "azure"
    endpoint: "https://dl-openai-3.openai.azure.com"
    api_version: "2024-10-21"
    auth_method: "azure_cli"
    max_concurrent: 10
    priority: 1
    supported_models:
      - "gpt-4o"
      # - "gpt-4o-mini"
      - "gpt-5"
      - "gpt-5-chat"
      - "gpt-5-mini"
      - "gpt-5-nano"
      - "gpt-5.2"
      - "gpt-5.2-chat"

  - name: "fxdata-eastus2"
    type: "azure"
    endpoint: "https://fxdata-eastus2.openai.azure.com"
    api_version: "2024-10-21"
    auth_method: "azure_cli"
    max_concurrent: 10
    priority: 1
    supported_models:
      - "gpt-4o"
      - "gpt-5"
      - "gpt-5-mini"
      - "gpt-5-nano"
      - "gpt-5.1"
      - "gpt-5.2"
      - "gpt-5.2-codex"

  - name: "fxdata-shared"
    type: "azure"
    endpoint: "https://fxdata-shared.openai.azure.com"
    api_version: "2024-10-21"
    auth_method: "azure_cli"
    max_concurrent: 10
    priority: 1
    supported_models:
      - "gpt-4o"
      - "gpt-4o-mini"
      - "gpt-5"


# Routing strategy options:
# - "round_robin": Fair distribution across endpoints (default)
# - "least_loaded": Route to endpoint with lowest current load
# - "priority": Prefer endpoints with lower priority number
routing_strategy: "round_robin"

# Try other endpoints if one fails
fallback_enabled: true

# Max retries per endpoint before moving to next
max_retries_per_endpoint: 3
