# Multi-endpoint load balancer that combines Azure OAI endpoints
# (multi_endpoint.yaml) AND the Azure AI Foundry endpoint
# (multi_endpoint_foundry.yaml). Useful when an experiment uses an
# Azure-OAI assistant (gpt-5.4) and a foundry user-sim (DeepSeek-V4-Flash)
# in the same run.

endpoints:
  - name: "mgalley-foundry2"
    type: "azure_foundry"
    endpoint: "https://mgalley-foundry2.services.ai.azure.com/openai/v1/"
    auth_method: "azure_identity"
    max_concurrent: 10
    priority: 1
    supported_models:
      DeepSeek-V3.2: 10
      DeepSeek-V3.1: 10
      DeepSeek-V3.2-Speciale: 10
      DeepSeek-V4-Flash: 250
      DeepSeek-R1-0528: 10
      grok-4-1-fast-non-reasoning: 10
      grok-4-1-fast-reasoning: 10
      grok-4-20-non-reasoning: 10
      grok-4-20-reasoning: 10
      Kimi-K2.6: 100
      Llama-3.3-70B-Instruct: 10
      Phi-4: 1
      Phi-4-reasoning: 1
      Mistral-Large-3: 10
      gpt-oss-120b: 250
      gpt-5.5: 250

  - name: "dl-openai-1"
    type: "azure"
    endpoint: "https://dl-openai-1.openai.azure.com"
    api_version: "2024-10-21"
    auth_method: "azure_cli"
    max_concurrent: 10
    priority: 1
    supported_models:
      gpt-4o: 10
      gpt-5: 10
      gpt-5-mini: 150
      gpt-5.4: 250

  - name: "dl-openai-3"
    type: "azure"
    endpoint: "https://dl-openai-3.openai.azure.com"
    api_version: "2024-10-21"
    auth_method: "azure_cli"
    max_concurrent: 10
    priority: 1
    supported_models:
      gpt-4o: 10
      gpt-5: 10
      gpt-5-chat: 10
      gpt-5-mini: 150
      gpt-5-nano: 10
      gpt-5.2: 10
      gpt-5.2-chat: 10
      gpt-5.4: 250

  - name: "fxdata-shared"
    type: "azure"
    endpoint: "https://fxdata-shared.openai.azure.com"
    api_version: "2024-10-21"
    auth_method: "azure_cli"
    max_concurrent: 10
    priority: 2
    supported_models:
      gpt-4o: 10
      gpt-4o-mini: 2000
      gpt-5: 10

routing_strategy: "least_loaded"
fallback_enabled: true
max_retries_per_endpoint: 2
