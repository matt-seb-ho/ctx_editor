# Multi-endpoint config with Azure + OpenRouter
# Enable with: ctx-editor load_balancer=multi_endpoint_openrouter
#
# Azure endpoints handle gpt-4o-mini (user/system roles).
# OpenRouter endpoint handles deepseek and qwen models (assistant/ctx_editor roles).

endpoints:
  - name: "dl-openai-3"
    type: "azure"
    endpoint: "https://dl-openai-3.openai.azure.com"
    api_version: "2024-10-21"
    auth_method: "azure_cli"
    max_concurrent: 10
    priority: 1
    supported_models:
      - "gpt-4o"
      - "gpt-4o-mini"

  - name: "openrouter"
    type: "openrouter"
    api_key_env: "OPENROUTER_API_KEY"
    max_concurrent: 10
    priority: 1
    supported_models:
      - "deepseek/deepseek-v3.2"
      - "qwen/qwen3.5-35b-a3b"

routing_strategy: "round_robin"
fallback_enabled: true
max_retries_per_endpoint: 3
