defaults:
  - experiment: baseline
  - model: gpt5_mini
  - task: all
  - user_mode: sharded  # sharded (LiC-identical) | natural (full problem, token budget)
  - load_balancer: null  # Optional: load_balancer/multi_endpoint for multi-endpoint parallelism
  - _self_

# Experiment naming
experiment_name: ${experiment.name}_${user_mode.name}_${model.name}_${task.name}

# Execution settings
execution:
  mode: parallel  # parallel | batched | sequential
  max_concurrent: 8
  batch_size: 5
  replay_source: null  # Path to baseline traces dir/file; if set, replays saved conversations instead of simulating new ones
  replay_turns: 1  # Number of turns to replay from the end of saved traces (1 = final turn only)

# Memory settings
memory:
  enabled: false
  source: null  # null | path to frozen memory | "continual" | "offline"
  target: assistant  # assistant | context_editor | edit_decision
  save_path: null  # Path to save updated memory
  # Grounding info for memory updates (helps model reflect with full context)
  include_full_spec_q: false  # Include the fully-specified single-turn question
  include_ground_truth_a: false  # Include the ground truth answer
  # Offline learning settings (used when source=offline)
  offline_trajectories: null  # Path to saved results (JSON, JSONL, or directory)
  offline_batch_size: 5  # Batch size for offline learning

# False negative analysis settings
false_negative_analysis:
  enabled: true
  mode: batch  # immediate | batch
  model: gpt-5-mini  # Model for user sim sufficiency check
  exclude_non_answer_attempts: false  # If true, exclude non-answer-attempt turns from accuracy denominator

# Logging settings
logging:
  output_dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  verbose: false

# Random seed for reproducibility
seed: 42

# Freeform metadata (merged into runs.yaml entries)
metadata:
  branch: newleaf
