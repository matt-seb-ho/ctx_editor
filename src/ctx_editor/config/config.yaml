defaults:
  - experiment: baseline
  - model: gpt4o_mini
  - task: all 
  - _self_

# Experiment naming
experiment_name: ${experiment.name}_${model.name}_${task.name}

# Execution settings
execution:
  mode: parallel  # parallel | batched | sequential
  max_concurrent: 8
  batch_size: 5

# Cheatsheet settings
cheatsheet:
  enabled: false
  source: null  # null | path to frozen cheatsheet | "continual"
  target: assistant  # assistant | context_editor
  save_path: null  # Path to save updated cheatsheet
  # Grounding info for cheatsheet updates (helps model reflect with full context)
  include_full_spec_q: false  # Include the fully-specified single-turn question
  include_ground_truth_a: false  # Include the ground truth answer

# Logging settings
logging:
  output_dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  save_traces: true
  verbose: false

# Random seed for reproducibility
seed: 42
