defaults:
  - experiment: baseline
  - model: gpt4o_mini
  - task: all 
  - _self_

# Experiment naming
experiment_name: ${experiment.name}_${model.name}_${task.name}

# Execution settings
execution:
  mode: parallel  # parallel | batched | sequential
  max_concurrent: 10
  batch_size: 5

# Cheatsheet settings
cheatsheet:
  enabled: false
  source: null  # null | path to frozen cheatsheet | "continual"
  target: assistant  # assistant | context_editor
  save_path: null  # Path to save updated cheatsheet

# Logging settings
logging:
  output_dir: outputs/${experiment_name}/${now:%Y-%m-%d_%H-%M-%S}
  save_traces: true
  verbose: false

# Random seed for reproducibility
seed: 42
