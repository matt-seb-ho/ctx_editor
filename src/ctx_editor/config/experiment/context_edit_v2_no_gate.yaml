# AC3-Reset (always-on) — Reset that fires on every analyzable turn.
# In last-turn replay this means: always edit the final turn.
# Paper-equivalent: ACC-Reset (gating disabled). See
# docs/paper_experiments_provenance.md.
name: context_edit_v2_no_gate

strategy:
  _target_: ctx_editor.strategies.ContextEditV2Strategy
  analyzer_model: ${model.ctx_editor.model}
  analyzer_timeout: ${oc.select:model.ctx_editor.timeout,60}
  analyzer_reasoning_effort: ${oc.select:model.ctx_editor.reasoning_effort,null}
  analyzer_prompt_version: v8
  min_turns: 1          # allow editing as early as turn 1
  max_resets: 100       # effectively unbounded — always-on
  use_memory: false
  memory_target: analyzer
  accumulate_instruction: false
  analysis_cache_dir: outputs/analysis_cache
