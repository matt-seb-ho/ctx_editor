# AC3-Gated-Reset — paper default. Gate decides whether the edit fires.
# In last-turn replay: analyzer runs; if needs_edit is False (no substantive
# issues found), the final turn is generated from the original full context.
# Paper config: min_turns=3, max_resets=3.
name: context_edit_v2_gated

strategy:
  _target_: ctx_editor.strategies.ContextEditV2Strategy
  analyzer_model: ${model.ctx_editor.model}
  analyzer_timeout: ${oc.select:model.ctx_editor.timeout,60}
  analyzer_reasoning_effort: ${oc.select:model.ctx_editor.reasoning_effort,null}
  analyzer_prompt_version: v8
  min_turns: 3
  max_resets: 3
  use_memory: false
  memory_target: analyzer
  accumulate_instruction: false
  analysis_cache_dir: outputs/analysis_cache
