# Agentic editing - model decides whether to compress
name: agentic_edit

strategy:
  _target_: ctx_editor.strategies.AgenticEditStrategy
  prompt_version: v3
  decision_model: ${model.ctx_editor.model}
  editor_model: ${model.ctx_editor.model}
  editor_timeout: ${oc.select:model.ctx_editor.timeout,60}
  edit_threshold_turns: 3
  use_memory: false
  memory_target: context_editor
