# Summarisation / condensation baseline (T1) — single condenser call per turn.
#
# Generic, non-analyzer LLM condensation of the conversation history, of the
# kind production agent harnesses use for context-length management. The
# summariser is instructed to compress FAITHFULLY: it is never told to find
# errors, judge correctness, or drop invalidated reasoning. That is the point
# of the comparison against AC3 — see neurips_review/autoresearch/tasks/T1/.
#
# Prompt: src/ctx_editor/strategies/prompts/summarize_v1.txt
name: summarize_v1

strategy:
  _target_: ctx_editor.strategies.SummarizationStrategy
  summarizer_model: ${model.ctx_editor.model}
  summarizer_timeout: ${oc.select:model.ctx_editor.timeout,300}
  summarizer_reasoning_effort: ${oc.select:model.ctx_editor.reasoning_effort,null}
  summarize_prompt: summarize_v1
  num_passes: 1
  min_turns: 1
