# MT-OSC (Singh et al., arXiv:2604.08782) — reimplementation, paper's headline
# window w=4. See src/ctx_editor/strategies/mtosc.py for a full statement of
# what is faithful to the paper and what the paper leaves underspecified.
#
# NOTE: at w=4 MT-OSC does not modify the context before turn 6 (the authors
# say as much; their Spider >=6-turn subset is n=6). Pair with `mtosc_w2` for
# the smallest window in the paper's own sweep (w in {2,3,4}).
name: mtosc_w4

strategy:
  _target_: ctx_editor.strategies.MTOSCStrategy
  condenser_model: ${model.ctx_editor.model}
  condenser_timeout: ${oc.select:model.ctx_editor.timeout,300}
  condenser_reasoning_effort: ${oc.select:model.ctx_editor.reasoning_effort,null}
  condenser_max_tokens: 10000
  condenser_temperature: 0.01
  condenser_prompt: mtosc_condenser
  window: 4
  gamma: 0.2
  tau: 1000
