# CollabLLM AC3-Augment with v8 analyzer prompt (post-NeurIPS scale-up).
# Differs from the legacy collabllm_append_analysis.yaml (which uses s1) by
# adopting v8 for cross-benchmark consistency with LiC.
name: collabllm_ac3_augment_v8

strategy:
  _target_: ctx_editor.strategies.AppendAnalysisStrategy
  analyzer_model: ${model.ctx_editor.model}
  analyzer_timeout: ${oc.select:model.ctx_editor.timeout,300}
  analyzer_reasoning_effort: ${oc.select:model.ctx_editor.reasoning_effort,null}
  analyzer_prompt_version: v8
  min_turns: 4
  use_memory: false
  memory_target: analyzer
  analysis_cache_dir: outputs/analysis_cache
