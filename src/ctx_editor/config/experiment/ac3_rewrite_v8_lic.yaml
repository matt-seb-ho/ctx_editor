# AC3-Rewrite v8 (analyzer-centered, with conversation) for LiC.
#
# Replaces v1 as the going-forward default. Fixes the v1 "trust user
# messages over analyzer" wart: the reviewer's notes are the rewriter's
# primary source; the conversation is reference for exact values only,
# not for re-deriving the task spec.
#
# Pair with `ac3_rewrite_v9_no_conv_lic.yaml` for the with-vs-without-
# conversation ablation (the two prompts differ ONLY in whether
# {conversation} is included).
name: ac3_rewrite_v8_lic

strategy:
  _target_: ctx_editor.strategies.ContextCompactionStrategy
  compaction_model: ${model.ctx_editor.model}
  compaction_timeout: ${oc.select:model.ctx_editor.timeout,60}
  compaction_reasoning_effort: ${oc.select:model.ctx_editor.reasoning_effort,null}
  compaction_prompt: context_compaction_v8
  open_ended_output: true
  min_turns: 1
  use_memory: false
  memory_target: system
  analyzer_prompt_version: v8
  analysis_cache_dir: outputs/analysis_cache
