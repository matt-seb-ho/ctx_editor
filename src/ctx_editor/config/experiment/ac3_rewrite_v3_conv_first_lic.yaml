# AC3-Rewrite v3 (conversation-first variant) for LiC.
#
# Tests the variant of Task 1.2b: keep the conversation in the rewrite
# prompt but place it BEFORE the analyzer notes so the notes are the
# most-recent (most-salient) input. Cheap to test alongside v3_no_conv.
name: ac3_rewrite_v3_conv_first_lic

strategy:
  _target_: ctx_editor.strategies.ContextCompactionStrategy
  compaction_model: ${model.ctx_editor.model}
  compaction_timeout: ${oc.select:model.ctx_editor.timeout,60}
  compaction_reasoning_effort: ${oc.select:model.ctx_editor.reasoning_effort,null}
  compaction_prompt: context_compaction_v3_conv_first
  analysis_prompt: compaction_analysis
  min_turns: 1
  use_memory: false
  memory_target: system
