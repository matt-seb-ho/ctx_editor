# AC3-Reset (always-on) with the "accumulate" instruction for actions task.
# See context_edit_v2_no_gate.yaml + context_edit_v2_accumulate.yaml notes.
name: context_edit_v2_no_gate_accumulate

strategy:
  _target_: ctx_editor.strategies.ContextEditV2Strategy
  analyzer_model: ${model.ctx_editor.model}
  analyzer_timeout: ${oc.select:model.ctx_editor.timeout,60}
  analyzer_reasoning_effort: ${oc.select:model.ctx_editor.reasoning_effort,null}
  analyzer_prompt_version: v8
  min_turns: 1
  max_resets: 100
  use_memory: false
  memory_target: analyzer
  accumulate_instruction: true
  analysis_cache_dir: outputs/analysis_cache
