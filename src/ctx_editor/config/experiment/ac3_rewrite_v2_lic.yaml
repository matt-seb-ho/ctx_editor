# AC3-Rewrite v2 for LiC — uses the structured (numbered sub-tasks)
# compaction prompt that preserves exact values and forbids merging
# distinct sub-tasks. Designed in response to Phase 1 failure-mode
# analysis (see docs/reports/post_neurips_r2_rewrite_analysis.md).
name: ac3_rewrite_v2_lic

strategy:
  _target_: ctx_editor.strategies.ContextCompactionStrategy
  compaction_model: ${model.ctx_editor.model}
  compaction_timeout: ${oc.select:model.ctx_editor.timeout,60}
  compaction_reasoning_effort: ${oc.select:model.ctx_editor.reasoning_effort,null}
  compaction_prompt: context_compaction_v2
  analysis_prompt: compaction_analysis
  min_turns: 1
  use_memory: false
  memory_target: system
  analyzer_prompt_version: v8
  analysis_cache_dir: outputs/analysis_cache
