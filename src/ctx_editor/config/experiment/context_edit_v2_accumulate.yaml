# S1.5 variant with accumulation instruction for parallel function call tasks
# Tells the assistant to include ALL function calls in its response,
# even those mentioned as "aligned" in the compacted context
name: context_edit_v2_accumulate

strategy:
  _target_: ctx_editor.strategies.ContextEditV2Strategy
  analyzer_model: ${model.ctx_editor.model}
  analyzer_timeout: ${oc.select:model.ctx_editor.timeout,60}
  analyzer_reasoning_effort: ${oc.select:model.ctx_editor.reasoning_effort,null}
  min_turns: 1
  max_resets: 3
  use_memory: false
  memory_target: analyzer
  accumulate_instruction: true
