# Summarisation baseline, NEUTRAL prompt (T1 robustness arm).
#
# `summarize_v1` explicitly tells the condenser "your job is compression, not
# evaluation". A reviewer could argue that clause forbids the baseline from
# doing the useful thing. This arm removes it: a minimal, generic "summarize
# the conversation" instruction with no prohibition either way, leaving the
# model free to audit the assistant's work if it spontaneously chooses to.
#
# Prompt: src/ctx_editor/strategies/prompts/summarize_v2_neutral.txt
name: summarize_v2_neutral

strategy:
  _target_: ctx_editor.strategies.SummarizationStrategy
  summarizer_model: ${model.ctx_editor.model}
  summarizer_timeout: ${oc.select:model.ctx_editor.timeout,300}
  summarizer_reasoning_effort: ${oc.select:model.ctx_editor.reasoning_effort,null}
  summarize_prompt: summarize_v2_neutral
  num_passes: 1
  min_turns: 1
