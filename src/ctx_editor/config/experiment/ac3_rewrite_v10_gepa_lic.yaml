# AC3-Rewrite v10 — GEPA-optimized seed-from-v9_no_conv winner.
# Seeded from context_compaction_v9_no_conv; reflection LM = DeepSeek-V4-Flash;
# budget = 20 metric calls; mini-eval = math conv0 limit=12.
# Best candidate scored 10/12 on the mini-eval (vs v9 seed at 9/12).
# Adds a "Critical constraint" paragraph forbidding the rewriter from
# pre-computing answers / showing math reasoning steps.
name: ac3_rewrite_v10_gepa_lic

strategy:
  _target_: ctx_editor.strategies.ContextCompactionStrategy
  compaction_model: ${model.ctx_editor.model}
  compaction_timeout: ${oc.select:model.ctx_editor.timeout,60}
  compaction_reasoning_effort: ${oc.select:model.ctx_editor.reasoning_effort,null}
  compaction_prompt: context_compaction_v10_gepa
  open_ended_output: true
  min_turns: 1
  use_memory: false
  memory_target: system
  analyzer_prompt_version: v8
  analysis_cache_dir: outputs/analysis_cache
