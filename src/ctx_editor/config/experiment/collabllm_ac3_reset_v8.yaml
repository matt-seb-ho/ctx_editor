# CollabLLM AC3-Reset (always-on) with v8 analyzer prompt.
# Phase 1 winner — promoted to CollabLLM for Phase 3 cross-benchmark redos.
name: collabllm_ac3_reset_v8

strategy:
  _target_: ctx_editor.strategies.ContextEditV2Strategy
  analyzer_model: ${model.ctx_editor.model}
  analyzer_timeout: ${oc.select:model.ctx_editor.timeout,300}
  analyzer_reasoning_effort: ${oc.select:model.ctx_editor.reasoning_effort,null}
  analyzer_prompt_version: v8
  min_turns: 1
  max_resets: 100        # effectively unbounded — always-on
  use_memory: false
  memory_target: analyzer
  accumulate_instruction: false
  analysis_cache_dir: outputs/analysis_cache
