# Agentic editing with continual memory learning (editor-targeted)
# NOTE: memory.* overrides must be passed on CLI since Hydra experiment
# configs only override the experiment group, not top-level keys.
name: agentic_edit_memory

strategy:
  _target_: ctx_editor.strategies.AgenticEditStrategy
  prompt_version: v3
  decision_model: ${model.ctx_editor.model}
  editor_model: ${model.ctx_editor.model}
  editor_timeout: ${oc.select:model.ctx_editor.timeout,60}
  edit_threshold_turns: 3
  use_memory: true
  memory_target: context_editor
