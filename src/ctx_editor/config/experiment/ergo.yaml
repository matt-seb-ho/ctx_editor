# ERGO baseline (Khalid et al. 2025): LLM-rewrite of user messages, full reset.
# Faithful to ERGO's reset operator (system + user prompt verbatim from
# /home/agent/ergo/core/{ergo.py,prompts.py}); entropy trigger is replaced by
# unconditional firing in replay mode (see strategy docstring).
name: ergo

strategy:
  _target_: ctx_editor.strategies.ERGORestartStrategy
  rewrite_model: ${model.ctx_editor.model}
  rewrite_timeout: ${oc.select:model.ctx_editor.timeout,300}
  min_turns: 1
  use_memory: false
  memory_target: system
