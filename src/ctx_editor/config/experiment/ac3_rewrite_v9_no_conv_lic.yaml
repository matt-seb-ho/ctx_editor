# AC3-Rewrite v9 (analyzer-centered, no-conversation) for LiC.
#
# Clean ablation against v8: structurally identical prompt, only
# difference is removal of {conversation}. Tests whether contagious
# context pollution reaches the rewriter even when the rewriter is
# already analyzer-centered.
name: ac3_rewrite_v9_no_conv_lic

strategy:
  _target_: ctx_editor.strategies.ContextCompactionStrategy
  compaction_model: ${model.ctx_editor.model}
  compaction_timeout: ${oc.select:model.ctx_editor.timeout,60}
  compaction_reasoning_effort: ${oc.select:model.ctx_editor.reasoning_effort,null}
  compaction_prompt: context_compaction_v9_no_conv
  open_ended_output: true
  min_turns: 1
  use_memory: false
  memory_target: system
  analyzer_prompt_version: v8
  analysis_cache_dir: outputs/analysis_cache
