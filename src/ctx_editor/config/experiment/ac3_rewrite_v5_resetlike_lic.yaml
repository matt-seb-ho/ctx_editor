# AC3-Rewrite v5 — "Reset-like LLM template-fill" for LiC.
#
# Designed in response to R3 Idea 1: we know Reset's template-fill is a
# successful transformation from (analyzer.task_spec, analyzer.aligned) to
# a working compacted message. The hypothesis is that an LLM, given just
# those two inputs and instructed to *complete the same template*, can
# match Reset (and maybe add light polish).
#
# Inputs to the rewriter LLM: analyzer.task_spec + analyzer.aligned only.
# Conversation is NOT in the prompt (matching v3_no_conv setup).
# Issues are NOT in the prompt (irrelevant to the compacted output).
name: ac3_rewrite_v5_resetlike_lic

strategy:
  _target_: ctx_editor.strategies.ContextCompactionStrategy
  compaction_model: ${model.ctx_editor.model}
  compaction_timeout: ${oc.select:model.ctx_editor.timeout,60}
  compaction_reasoning_effort: ${oc.select:model.ctx_editor.reasoning_effort,null}
  compaction_prompt: context_compaction_v5_resetlike
  analysis_prompt: compaction_analysis
  min_turns: 1
  use_memory: false
  memory_target: system
  analyzer_prompt_version: v8
  analysis_cache_dir: outputs/analysis_cache
