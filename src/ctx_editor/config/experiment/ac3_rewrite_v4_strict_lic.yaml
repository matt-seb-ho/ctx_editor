# AC3-Rewrite v4 (strict-relay variant) for LiC.
#
# Designed in response to the Task 1.1 finding that 63% of rewrite
# failures are due to the rewriter LLM *hallucinating* content not
# in either the analyzer notes or the conversation. This variant:
#   - removes the conversation from the prompt entirely (like v3_no_conv)
#   - frames the rewriter as a "relay" rather than a "writer"
#   - bans verbatim code/numerical results in the work-so-far section
#   - caps the work-so-far at 2 sentences
#   - explicitly says: "treat your own judgement as untrustworthy"
# Goal: at least match Reset; ideally with a small LLM-polish margin.
name: ac3_rewrite_v4_strict_lic

strategy:
  _target_: ctx_editor.strategies.ContextCompactionStrategy
  compaction_model: ${model.ctx_editor.model}
  compaction_timeout: ${oc.select:model.ctx_editor.timeout,60}
  compaction_reasoning_effort: ${oc.select:model.ctx_editor.reasoning_effort,null}
  compaction_prompt: context_compaction_v4_strict
  analysis_prompt: compaction_analysis
  min_turns: 1
  use_memory: false
  memory_target: system
  analyzer_prompt_version: v8
  analysis_cache_dir: outputs/analysis_cache
