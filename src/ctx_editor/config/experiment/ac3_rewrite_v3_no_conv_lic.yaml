# AC3-Rewrite v3 (no-conversation variant) for LiC.
#
# Tests the hypothesis (post_may18 R3 Task 1.2b) that the conversation
# being fed into the rewrite LLM call introduces "contagious context
# pollution" — the rewriter latches onto verbatim prior code or
# numerical speculation and anchors the assistant on those. This
# variant feeds ONLY the analyzer's output into the compaction call;
# the conversation is removed from the rewrite prompt entirely.
name: ac3_rewrite_v3_no_conv_lic

strategy:
  _target_: ctx_editor.strategies.ContextCompactionStrategy
  compaction_model: ${model.ctx_editor.model}
  compaction_timeout: ${oc.select:model.ctx_editor.timeout,60}
  compaction_reasoning_effort: ${oc.select:model.ctx_editor.reasoning_effort,null}
  compaction_prompt: context_compaction_v3_no_conv
  analysis_prompt: compaction_analysis
  min_turns: 1
  use_memory: false
  memory_target: system
  analyzer_prompt_version: v8
  analysis_cache_dir: outputs/analysis_cache
