# Summarisation / condensation baseline (T1) — TWO condenser calls per turn.
#
# Identical to `summarize_v1` except a second, faithfulness-checking pass runs
# over the draft summary. Its only purpose is to match AC3-Reset's two-query
# analyzer call budget exactly, so that a null result for summarisation cannot
# be attributed to giving the baseline half the compute.
#
# The refinement pass checks the SUMMARY against the TRANSCRIPT. It is
# explicitly not allowed to judge the assistant's work or solve the task.
#
# Prompts: strategies/prompts/summarize_v1.txt + summarize_v1_refine.txt
name: summarize_v1_2pass

strategy:
  _target_: ctx_editor.strategies.SummarizationStrategy
  summarizer_model: ${model.ctx_editor.model}
  summarizer_timeout: ${oc.select:model.ctx_editor.timeout,300}
  summarizer_reasoning_effort: ${oc.select:model.ctx_editor.reasoning_effort,null}
  summarize_prompt: summarize_v1
  refine_prompt: summarize_v1_refine
  num_passes: 2
  min_turns: 1
