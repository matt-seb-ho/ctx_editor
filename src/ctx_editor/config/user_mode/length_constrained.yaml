# Length-constrained natural user mode — sees full problem, token-budgeted turns
name: length_constrained
# previous run
# total_token_budget: 500     # max output tokens across all user turns
# per_turn_token_budget: 150  # recommended output tokens per user turn (soft target in prompt)
total_token_budget: 180     # max output tokens across all user turns
per_turn_token_budget: 30   # recommended output tokens per user turn (soft target in prompt)
hard_cap_multiplier: 1.2    # max_tokens = per_turn_token_budget * this (hard API cap)
include_shards: false       # whether to show shards as chunking hints
