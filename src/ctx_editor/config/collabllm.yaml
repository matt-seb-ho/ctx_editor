defaults:
  - experiment: collabllm_baseline
  - model: gpt4o_mini
  - load_balancer: null
  - _self_

# Experiment naming
experiment_name: ${experiment.name}_${model.name}_${task.name}

# Task settings (inline — no separate task config needed since we load dynamically)
task:
  name: collabllm_math
  dataset_name: math-hard  # Key into COLLABLLM_DATASETS registry
  split: test
  limit: null
  max_turns: 14  # CollabLLM default

# Execution settings
execution:
  mode: parallel
  max_concurrent: 8
  batch_size: 5

# Memory settings
memory:
  enabled: false
  source: null
  target: assistant
  save_path: null
  include_full_spec_q: false
  include_ground_truth_a: false
  offline_trajectories: null
  offline_batch_size: 5

# Logging settings
logging:
  output_dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  verbose: false

seed: 42

metadata:
  branch: collabllm
