experiment:
  name: baseline
  strategy:
    _target_: ctx_editor.strategies.BaselineStrategy
    use_memory: false
    memory_target: system
model:
  name: gpt-5.4-mini
  user:
    model: gpt-4o_2024-11-20
    max_tokens: 1000
    temperature: 1.0
  assistant:
    model: gpt-5.4-mini_2026-03-17
    max_tokens: 10000
    temperature: 1.0
    timeout: 300
    reasoning_effort: medium
  system:
    model: gpt-4o_2024-11-20
    max_tokens: 1000
    temperature: 0.0
  ctx_editor:
    model: gpt-5.4-mini_2026-03-17
    max_tokens: 12000
    temperature: 1.0
    timeout: 300
    reasoning_effort: medium
task:
  name: dev_math
  data_file: data/dev_math_subset.json
  filter: math
  limit: 1
  max_turns: 20
  task_version_map:
    math: math_v2
user_mode:
  name: entangled
  entanglement_level: 0
load_balancer:
  endpoints:
  - name: trapi-redmond-interactive
    type: azure_foundry
    endpoint: https://trapi.research.microsoft.com/redmond/interactive/openai/v1/
    auth_method: azure_identity
    aad_scope: api://trapi/.default
    max_concurrent: 20
    priority: 1
    supported_models:
      gpt-5.4-mini_2026-03-17: 100
      gpt-4o_2024-11-20: 50
  routing_strategy: least_loaded
  fallback_enabled: true
  max_retries_per_endpoint: 2
experiment_name: baseline_entangled_gpt-5.4-mini_dev_math
execution:
  mode: parallel
  max_concurrent: 2
  batch_size: 5
  replay_source: null
  replay_turns: 1
memory:
  enabled: false
  source: null
  target: assistant
  save_path: null
  include_full_spec_q: false
  include_ground_truth_a: false
  include_oracle_spec: false
  oracle_spec_path: null
  offline_trajectories: null
  offline_batch_size: 5
false_negative_analysis:
  enabled: false
  mode: batch
  model: gpt-5-mini
  exclude_non_answer_attempts: false
logging:
  output_dir: research/entanglement/artifacts/smoke_lvl0
  verbose: false
seed: 42
metadata:
  branch: newleaf
