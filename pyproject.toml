[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ctx-editor"
version = "0.1.0"
description = "Context Editor Evaluation System for Lost in Conversation experiments"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Research Team"}
]
keywords = ["llm", "evaluation", "context-editing", "conversation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "openai>=1.0.0",
    "hydra-core>=1.3.0",
    "omegaconf>=2.3.0",
    "aiohttp>=3.9.0",
    "datasets>=2.14.0",
]

[project.optional-dependencies]
anthropic = ["anthropic>=0.18.0"]
viewer = ["streamlit>=1.30.0"]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]
all = ["ctx-editor[anthropic,viewer,dev]"]

[project.scripts]
ctx-editor = "ctx_editor.run_experiment:main"
ctx-editor-collabllm = "ctx_editor.run_collabllm:main"

[project.urls]
Homepage = "https://github.com/research/ctx-editor"
Repository = "https://github.com/research/ctx-editor"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ctx_editor*", "lic*"]  # Include both ctx_editor and lic packages

[tool.setuptools.package-data]
"ctx_editor" = ["config/**/*.yaml", "cheatsheet/prompts/*.txt", "prompts/collabllm/*.txt"]

[tool.black]
line-length = 100
target-version = ["py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
